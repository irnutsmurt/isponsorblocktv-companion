[project]
name = "isponsorblocktv-webui"
version = "0.1.0"
description = "Web UI web app for iSponsorBlockTV: secure setup, pairing, configuration, statistics and diagnostics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "webauthn>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webui*"]
